schema_version: 1
locales:
  zh:
    metadata_name: "对齐 Starter Bundle"
    metadata_description: "由 Web alignment flow 生成的 bundle。"
    loop_name: "对齐 Starter Bundle"
    collaboration_summary: >-
      将工作协议投影到 spec 任务契约、Builder / Inspector / GateKeeper 角色交接，以及先汇集证据再裁决的 workflow。
      因为最终反馈太慢，不适合作为唯一控制信号，后续轮次会随着新证据、阻断项和 handoff 回到这份契约，
      而不是把一次 Agent 执行或一次 review 当成足够。后续轮次先构建聚焦 starter slice，再把 Inspector 证据路由到最终裁决前，
      并用弱证明控制点把下一轮转向先补证据再打磨。优先选择小而已证明的主流程，而不是打磨充分但未证明的宽泛功能；
      证据薄弱时让 GateKeeper 拒绝速度或表面完整性。中间控制点要测量弱证据和假完成偏差，触发检查、纠正或暂停决策，
      并让所需证据目标保持明确。GateKeeper 只有在任务契约、角色证据和 workflow handoff 都证明真实完成时才收束。
      证据投影必须区分已证明的直接运行证据、弱证据、未证明的承诺面、阻断类假完成，以及可见残余风险。{local_governance_sentence}
    spec_markdown: |-
      # Task

      在目标 workdir 中为目标用户交付聚焦的 starter experience，用小而可维护的改动保住面向用户的主流程，并留下能让 Inspector 和 GateKeeper 验证真实完成的证据路径。

      # Done When

      - 面向目标用户的主流程可以端到端运行。
      - 实现有项目内证据覆盖。

      # Guardrails

      - 改动保持在本次请求边界内。

      # Success Surface

      - 目标用户可以完成主流程，并且结果可理解、可维护，首轮后容易继续扩展。

      # Fake Done

      - 只有 happy path 声称、没有可复现证据时不得通过。
      - 缺少说明已收集证据的 handoff 时不得通过。

      # Evidence Preferences

      - 优先使用项目内检查、直接运行输出和具体产物，而不是截图或口头声称。
      - 每个角色都要留下清晰 handoff，说明改了什么、检查了什么或阻断了什么。
      - 最终反馈太慢，不适合作为唯一控制信号，因此每轮都需要在最终裁决前留下中间证据。
      - 中间控制点应测量关键风险，触发继续、纠正或暂停决策，并让所需证据目标保持明确。
      - 最终证据应区分为已证明、弱证据、未证明、阻断或残余风险，而不是压平成一段总结。

      # Execution Strategy

      后续轮次先构建聚焦 starter slice，再把 Inspector 证据路由到最终裁决前，并用弱证明控制点把下一轮转向先补证据再打磨。

      # Residual Risk

      可接受的轻微 polish 缺口或残余风险必须明确点名、可见、已跟踪且有人接手 follow-up；主流程行为未证明或验证证据薄弱时必须 fail closed。

      # Role Notes

      ## Builder Notes

      优先小而可维护的 patch，不做宽泛重写。

      ## Inspector Notes

      收集可复现证据，并直接指出缺失的证明。

      ## GateKeeper Notes

      Done When、fake-done 风险和证据偏好没有同时满足时必须 fail closed。
    workflow_collaboration_intent: >-
      后续轮次先构建一个聚焦 starter slice，再把 Inspector 证据路由到最终裁决前，并用弱证明控制点让证据薄弱、
      偏差或假完成提前暴露，触发修复或阻断；只有两个检查视角都支持任务契约时，GateKeeper 才能 finish。
    roles:
      builder:
        name: "聚焦 Builder"
        description: "实现最小且可维护的变更。"
        prompt_markdown: |-
          ---
          version: 1
          archetype: builder
          ---

          谨慎构建聚焦 starter slice，保持仓库结构一致。handoff 必须说明变更后的用户可见行为、验证证据，以及任何应阻止 Inspector 或 GateKeeper 继续的 blocker。{builder_governance}
        posture_notes: "保持实现收窄，让 workspace 更容易验证；优先具体证据和清晰 handoff，而不是铺开很多无法证明的功能。"
      contract-inspector:
        name: "契约 Inspector"
        description: "检查任务契约、guardrails、fake-done 风险、执行策略、判断取舍、本地治理和残余风险姿态。"
        prompt_markdown: |-
          ---
          version: 1
          archetype: inspector
          ---

          对照 Done When、Guardrails、Fake Done、Evidence Preferences、Execution Strategy、Judgment Tradeoffs、Local Governance 和 Residual Risk 检查 Builder handoff。handoff 必须点明契约不匹配、缺失证明、执行顺序漂移、取舍被降低、本地治理缺口，以及任何应阻止 GateKeeper finish 的 blocker。证据薄弱时，要说明它应触发什么决策，以及下一轮执行应如何改变。{inspector_governance}
        posture_notes: "优先契约级证明，而不是泛泛信心；交付 slice 不符合约定范围或 fake-done 风险未解决时必须 block。"
      evidence-inspector:
        name: "证据 Inspector"
        description: "在签字前收集可复现证据。"
        prompt_markdown: |-
          ---
          version: 1
          archetype: inspector
          ---

          从直接证据、项目内命令和具体产物开始检查。handoff 必须指出最强证明、缺失证明，以及任何应阻止 GateKeeper finish 的 blocker。
        posture_notes: "优先可复现运行输出和具体产物；阻断空泛完成声称、缺上下文截图或未验证 happy path，并说明哪类证据还缺失。"
      gatekeeper:
        name: "审慎 GateKeeper"
        description: "证据薄弱时 fail closed。"
        prompt_markdown: |-
          ---
          version: 1
          archetype: gatekeeper
          ---

          根据直接证据裁决，不接受空泛完成声称。只有 Builder 和 Inspector handoff 能证明任务契约、执行策略、判断取舍、存在时的本地治理和残余风险姿态时才 finish；否则用最小修复阻断。把 status-only checkpoint 视为不足：控制点必须能影响纠正、收束或残余风险交接。{gatekeeper_governance}
        posture_notes: "只有任务和验证证据一致时才收束；handoff evidence 缺失、薄弱或没有覆盖主流程时必须 fail closed。"
