[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopora"
version = "0.1.0"
description = "Local-first platform for long-running AI Agent tasks."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "ai-agents",
  "agent-workflows",
  "evidence",
  "fastapi",
  "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "markdown>=3.6",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
  "typer>=0.26.6",
  "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/huyusong10/Loopora"
Repository = "https://github.com/huyusong10/Loopora"
Issues = "https://github.com/huyusong10/Loopora/issues"
Security = "https://github.com/huyusong10/Loopora/security/policy"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "playwright>=1.55.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
loopora = "loopora.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loopora*"]

[tool.setuptools.package-data]
loopora = [
  "templates/*.html",
  "templates/partials/*.html",
  "static/*.css",
  "static/*.js",
  "static/pages/*.js",
  "static/pages/*.css",
  "static/styles/*.css",
  "assets/logo/*.svg",
  "assets/prompts/*.md",
  "assets/spec_practices/*.md",
  "assets/alignment/*.md",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "journey: local journey check coverage against in-process Loopora Web or local browser fixtures",
  "real_cli: opt-in real-environment probe that uses a real provider CLI for the minimal provider adapter boundary",
  "real_agent: opt-in real-environment probe that drives a real Coding Agent host or slash/skill command template",
  "release_web: opt-in real-environment probe against a real loopora serve process",
  "real_workflow_experiment: opt-in heavy real-provider workflow experiments that preserve artifacts and are not part of the release real-probe gate",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = [
  "E9",
  "F",
  "A",
  "ASYNC",
  "B",
  "ARG",
  "BLE",
  "C4",
  "C901",
  "DTZ",
  "ERA",
  "EXE",
  "FA",
  "FAST",
  "FBT",
  "FURB",
  "G",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PLC0206",
  "PLR0402",
  "PLE",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR1711",
  "PLW",
  "PGH",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RUF",
  "RUF100",
  "RSE",
  "SIM",
  "SLOT",
  "T20",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Loopora intentionally includes Chinese product copy and examples.
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Remaining PLR0913 exceptions are stable CLI callback or recovery projection
# boundaries; new internal helpers should use structured request objects.
"src/loopora/cli_agent_recovery.py" = ["PLR0913"]
"src/loopora/cli_agent_recovery_results.py" = ["PLR0913"]
"src/loopora/cli_agent_runtime_commands.py" = ["PLR0913"]
"src/loopora/cli_agent_submit_repair.py" = ["PLR0913"]
"src/loopora/cli_agent_submit_repair_results.py" = ["PLR0913"]
"src/loopora/cli_loop_commands.py" = ["PLR0913"]
"src/loopora/cli_orchestration_commands.py" = ["PLR0913"]
"src/loopora/cli_role_commands.py" = ["PLR0913"]
"src/loopora/cli_root_commands.py" = ["PLR0913"]
"tests/probes/real_environment/run_real_probes.py" = ["T201"]
"tests/reviews/run.py" = ["T201"]

[tool.uv]
package = true
