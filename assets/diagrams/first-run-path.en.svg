<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Loopora first-use path</title>
  <desc id="desc">A diagram showing the first-use route choices: Fit Guide/Web choices first when you are outside an Agent session, same-Agent setup when you are already in Codex, Claude Code, or OpenCode, and import or manual expert paths for reviewed plan files. All paths preserve task judgment in one reviewable Loop and write evidence, gaps, blockers, and verdicts into the same local record.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#059669"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #5b6475; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .agent { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
      .cmd { fill: #2563eb; }
      .web { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.5; }
      .record { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
      .h { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1e3a8a; }
      .cmdText { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
      .green { fill: #065f46; }
      .shadow { filter: drop-shadow(0 10px 18px rgb(15 23 42 / 0.10)); }
    </style>
  </defs>

  <rect width="1000" height="520" rx="28" class="canvas"/>
  <text x="500" y="58" text-anchor="middle" class="title">Pick a path, one Loop record</text>
  <text x="500" y="91" text-anchor="middle" class="sub">Outside an Agent: Fit Guide/Web choices. Inside one: same-Agent setup.</text>

  <g class="shadow">
    <rect x="58" y="132" width="410" height="154" rx="20" class="web"/>
    <text x="96" y="171" class="h green">Fit Guide/Web choices</text>
    <text x="96" y="202" class="body">Default outside an Agent session</text>
    <text x="96" y="229" class="body">Web conversation / Plan File import</text>
    <text x="96" y="256" class="body">Manual expert paths when reviewed</text>

    <rect x="532" y="132" width="410" height="154" rx="20" class="agent"/>
    <text x="570" y="171" class="h">Same-Agent setup</text>
    <text x="570" y="202" class="body">Already inside a host Agent</text>
    <text x="570" y="229" class="body">Codex / Claude Code / OpenCode</text>
    <rect x="570" y="241" width="150" height="42" rx="14" class="cmd"/>
    <text x="645" y="268" text-anchor="middle" class="cmdText">/loopora-plan</text>
    <rect x="740" y="241" width="150" height="42" rx="14" class="cmd"/>
    <text x="815" y="268" text-anchor="middle" class="cmdText">/loopora-run</text>
  </g>

  <g class="shadow">
    <rect x="260" y="326" width="220" height="82" rx="18" class="lane"/>
    <text x="370" y="360" text-anchor="middle" class="h">Reviewable Loop</text>
    <text x="370" y="388" text-anchor="middle" class="body">Plan, adjust, confirm</text>

    <rect x="520" y="326" width="260" height="82" rx="18" class="record"/>
    <text x="650" y="360" text-anchor="middle" class="h">Same local record</text>
    <text x="650" y="388" text-anchor="middle" class="body">Evidence, gaps, blockers, verdict</text>
  </g>

  <path d="M263 292 L350 313" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M737 292 L434 322" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M480 367 H506" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="500" y="460" text-anchor="middle" class="body">Start from the path you are actually in; evidence stays in one local record.</text>
</svg>
