<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">迁移任务中的证据驱动循环</title>
  <desc id="desc">图示 React 到 Vue 等价迁移如何从目标、执行产物、证据桶和漂移风险进入下一轮聚焦与收尾裁决。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="720" rx="28" fill="#f6f8fb"/>
  <text x="500" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">迁移任务：commit 很多不等于等价已证明</text>
  <text x="500" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b6475">下一轮跟着证据缺口走，而不是继续堆产出</text>

  <rect x="58" y="138" width="248" height="184" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="182" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">迁移目标</text>
  <text x="86" y="222" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">React → Vue 等价迁移</text>
  <text x="86" y="258" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">保留原 API 与交互</text>
  <text x="86" y="294" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">交付前可审查</text>
  <circle cx="72" cy="216" r="5" fill="#2563eb"/>
  <circle cx="72" cy="252" r="5" fill="#2563eb"/>
  <circle cx="72" cy="288" r="5" fill="#2563eb"/>

  <rect x="376" y="126" width="248" height="208" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">执行产物</text>
  <text x="404" y="213" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">组件、demo、测试、文档</text>
  <text x="404" y="247" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">commit 很多</text>
  <text x="404" y="281" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">Vue 项目能跑</text>
  <text x="404" y="315" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">但这些还不是完成本身</text>
  <circle cx="391" cy="207" r="4.5" fill="#2563eb"/>
  <circle cx="391" cy="241" r="4.5" fill="#2563eb"/>
  <circle cx="391" cy="275" r="4.5" fill="#2563eb"/>
  <circle cx="391" cy="309" r="4.5" fill="#d97706"/>

  <rect x="694" y="138" width="248" height="184" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="818" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">证据桶</text>
  <rect x="725" y="208" width="80" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="765" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46">已证明</text>
  <rect x="823" y="208" width="80" height="32" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="863" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#9a3412">弱证据</text>
  <rect x="725" y="258" width="80" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="765" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#3730a3">未证明</text>
  <rect x="823" y="258" width="80" height="32" rx="16" fill="#fef2f2" stroke="#fecaca"/>
  <text x="863" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#991b1b">阻断风险</text>

  <rect x="160" y="396" width="680" height="106" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="500" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">漂移风险检查</text>
  <text x="205" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">行为不等价</text>
  <text x="363" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">只跑干净 demo</text>
  <text x="537" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">越界新增 API</text>
  <text x="700" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">隐藏未迁移项</text>
  <circle cx="190" cy="468" r="5" fill="#dc2626"/>
  <circle cx="348" cy="468" r="5" fill="#d97706"/>
  <circle cx="522" cy="468" r="5" fill="#dc2626"/>
  <circle cx="685" cy="468" r="5" fill="#dc2626"/>

  <rect x="150" y="548" width="700" height="96" rx="20" fill="#172033" filter="url(#shadow)"/>
  <text x="500" y="586" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">下一轮聚焦与收尾裁决</text>
  <rect x="188" y="608" width="132" height="30" rx="15" fill="#dbeafe"/>
  <text x="254" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">补等价证据</text>
  <rect x="344" y="608" width="116" height="30" rx="15" fill="#dbeafe"/>
  <text x="402" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">收窄范围</text>
  <rect x="484" y="608" width="116" height="30" rx="15" fill="#fee2e2"/>
  <text x="542" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">阻断收尾</text>
  <rect x="624" y="608" width="188" height="30" rx="15" fill="#e0f2fe"/>
  <text x="718" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#075985">声明可接管残余风险</text>

  <path d="M312 230 C342 230 348 230 370 230" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 230 C660 230 666 230 688 230" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M818 330 C818 370 744 386 682 394" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 508 L500 540" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M286 548 C214 526 182 498 182 330" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>
</svg>
