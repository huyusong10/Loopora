<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-driven loop for a migration task</title>
  <desc id="desc">The diagram shows a React to Vue equivalent port moving from goal, artifacts, evidence buckets, and drift risks into focused next work and closure decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="720" rx="28" fill="#f6f8fb"/>
  <text x="500" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Migration task: many commits do not prove equivalence</text>
  <text x="500" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b6475">The next round follows evidence gaps instead of piling on more output</text>

  <rect x="58" y="138" width="248" height="184" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="182" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Migration goal</text>
  <text x="86" y="222" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">React → Vue equivalent port</text>
  <text x="86" y="258" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Preserve original API and UX</text>
  <text x="86" y="294" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Reviewable before delivery</text>
  <circle cx="72" cy="216" r="5" fill="#2563eb"/>
  <circle cx="72" cy="252" r="5" fill="#2563eb"/>
  <circle cx="72" cy="288" r="5" fill="#2563eb"/>

  <rect x="376" y="126" width="248" height="208" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Artifacts</text>
  <text x="404" y="213" font-family="Inter, Arial, sans-serif" font-size="14.5" fill="#1e3a8a">components, demos, tests, docs</text>
  <text x="404" y="247" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">many commits</text>
  <text x="404" y="281" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">Vue project runs</text>
  <text x="404" y="315" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#1e3a8a">but this is not completion</text>
  <circle cx="391" cy="207" r="4.5" fill="#2563eb"/>
  <circle cx="391" cy="241" r="4.5" fill="#2563eb"/>
  <circle cx="391" cy="275" r="4.5" fill="#2563eb"/>
  <circle cx="391" cy="309" r="4.5" fill="#d97706"/>

  <rect x="694" y="138" width="248" height="184" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="818" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Evidence buckets</text>
  <rect x="725" y="208" width="80" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="765" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46">proven</text>
  <rect x="823" y="208" width="80" height="32" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="863" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#9a3412">weak</text>
  <rect x="725" y="258" width="80" height="32" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="765" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#3730a3">unproven</text>
  <rect x="823" y="258" width="80" height="32" rx="16" fill="#fef2f2" stroke="#fecaca"/>
  <text x="863" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#991b1b">blocking</text>

  <rect x="160" y="396" width="680" height="106" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="500" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Drift risk review</text>
  <text x="205" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">behavior differs</text>
  <text x="363" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">clean demos only</text>
  <text x="537" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">new scope APIs</text>
  <text x="700" y="474" font-family="Inter, Arial, sans-serif" font-size="15.5" fill="#334155">hidden gaps</text>
  <circle cx="190" cy="468" r="5" fill="#dc2626"/>
  <circle cx="348" cy="468" r="5" fill="#d97706"/>
  <circle cx="522" cy="468" r="5" fill="#dc2626"/>
  <circle cx="685" cy="468" r="5" fill="#dc2626"/>

  <rect x="150" y="548" width="700" height="96" rx="20" fill="#172033" filter="url(#shadow)"/>
  <text x="500" y="586" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Focused next round and closure decision</text>
  <rect x="176" y="608" width="146" height="30" rx="15" fill="#dbeafe"/>
  <text x="249" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">prove equivalence</text>
  <rect x="346" y="608" width="118" height="30" rx="15" fill="#dbeafe"/>
  <text x="405" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">narrow scope</text>
  <rect x="488" y="608" width="116" height="30" rx="15" fill="#fee2e2"/>
  <text x="546" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">block closure</text>
  <rect x="628" y="608" width="196" height="30" rx="15" fill="#e0f2fe"/>
  <text x="726" y="629" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#075985">state owned residual risk</text>

  <path d="M312 230 C342 230 348 230 370 230" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 230 C660 230 666 230 688 230" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M818 330 C818 370 744 386 682 394" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 508 L500 540" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M286 548 C214 526 182 498 182 330" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>
</svg>
