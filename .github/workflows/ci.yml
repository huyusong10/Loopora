name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: test-${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run default-fast verification gate
        run: uv run loopora dev check

  browser-journey:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: browser-journey

      - name: Install dependencies
        run: uv sync --locked

      - name: Check dependency compatibility
        run: uv pip check

      - name: Run browser journey checks
        timeout-minutes: 10
        run: uv run pytest tests/checks/journeys -q
