name: Bug report
description: Report reproducible incorrect Loopora behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never paste tokens, private logs, transcripts, recovery archives, or sensitive paths. See SUPPORT.md and use private vulnerability reporting for security issues.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the smallest repeatable steps.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Web
        - Agent adapter
        - Run/evidence lifecycle
        - Local state/files
        - Package/install
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Public environment evidence
      description: Optional. Paste only reviewed `loopora --version` and `loopora doctor --public-json --workdir "$PWD"` output.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private paths, private logs, transcripts, and recovery artifacts.
          required: true
