name: Feature request
description: Propose a stable Loopora capability or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the recurring judgment or user outcome, not only a preferred implementation. Do not include private project data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or recurring judgment
      description: What currently requires repeated human correction, evidence review, or handoff work?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired stable outcome
      description: What should users be able to observe or rely on?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and fake-done risks
      description: What would prove the feature works, and what shallow result could look complete without being complete?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Note affected commands, routes, data, permissions, or existing workflows.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private paths, private logs, transcripts, and recovery artifacts.
          required: true
